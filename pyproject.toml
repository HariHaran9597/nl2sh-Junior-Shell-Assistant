[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sh-plus"
version = "0.1.0"
description = "nl2sh+ Junior Shell Assistant - Context-aware NL->Bash with Risk+Explain+Dry-run + MCP"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml>=6.0","tqdm>=4.66.0","requests>=2.31.0","gradio>=4.0.0","mcp>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0","datasets","pandas"]

[project.scripts]
nl2sh = "cli.nl2sh:main"

[tool.setuptools.packages.find]
include = ["cli*","src*","mcp_server*"]
