[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sh-plus"
version = "0.1.0"
description = "nl2sh+ Junior Shell Assistant - Context-aware NL->Bash with Risk+Explain+Dry-run + MCP"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
app = ["gradio>=4.0.0"]
mcp = ["mcp>=1.0.0"]
train = ["datasets>=2.19.0","pandas>=2.0","pyyaml>=6.0","tqdm>=4.66.0","requests>=2.31.0","docker>=7.0.0"]
dev = ["pytest>=8.0","datasets","pandas"]

[project.scripts]
nl2sh = "cli.nl2sh:main"

[tool.setuptools.packages.find]
include = ["cli*","src*","mcp_server*"]
